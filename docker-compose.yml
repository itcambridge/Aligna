version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:v1.7.3
    command: ["./qdrant"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    restart: unless-stopped
    # Only bind to localhost; Nginx (on host) will reverse-proxy to this
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    depends_on:
      - qdrant
    volumes:
      # Mount the application code to ensure container uses current code
      - .:/app
      # Mount for temporary directories
      - /tmp:/tmp
      # Mount for logs
      - ./logs:/app/logs
      # Mount for export debug log
      - ./export_debug.log:/app/export_debug.log
      # Mount for exports
      - ./exports:/app/exports

volumes:
  qdrant_data:
